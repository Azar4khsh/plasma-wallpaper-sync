name: i18n-extract-translations

on:
  push:
    branches:
      - main
    paths:
      - "package/contents/**/*.qml"
      - "bin/i18n"

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  i18n-extract-translations:
    runs-on: ubuntu-latest
    env:
      BRANCH: action-i18n-extract-translations
      TITLE: "ci: extract translations"
      BODY: This PR was created by GitHub Actions

    steps:
      - uses: actions/checkout@v2

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Check if translations are outdated
        id: check-translations
        run: |
          if ! ./bin/i18n check; then
            echo "outdated=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract translations
        if: ${{ steps.check-translations.outputs.outdated == 'true' }}
        run: |
          ./bin/i18n extract

      - name: Create PR
        if: ${{ steps.check-translations.outputs.outdated == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain translate/)" ]; then
            echo "No changes found."
            exit 0
          fi

          git checkout -b action-i18n-extract-translations
          git add translate/
          git commit -m "chore(i18n): update translations"
          git push origin action-i18n-extract-translations --force

          gh pr create \
            --fill \
            --body "This PR was automatically generated by the i18n update workflow to keep translations up to date." \
            || echo "PR already exists or failed to create."
